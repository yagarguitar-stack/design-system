<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音楽の計算 — 見本</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="scale.css">
<style>
  body{font-family:var(--font-body,sans-serif);margin:0;padding:16px;max-width:760px;margin-inline:auto;line-height:1.7;background:#faf7f0;color:#2a2420}
  h1{font-family:var(--font-head,serif);font-size:1.4rem}
  h2{font-family:var(--font-head,serif);font-size:1.1rem;margin-top:28px;border-bottom:1px solid #d8cfc0}
  input,select,button{font:inherit;padding:6px 10px;border:1px solid #bfb3a0;border-radius:6px;background:#fff}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  table{border-collapse:collapse;margin-top:8px;width:100%}
  td,th{border:1px solid #d8cfc0;padding:4px 8px;text-align:left}
  th{background:#efe8da;font-weight:normal;white-space:nowrap}
  .wrap{overflow-x:auto}
  .err{color:#a03020}
</style></head><body>
<h1>音楽の計算（theory.js）の見本</h1>
<div class="row">書き方：
  <select id="style"><option value="ja">CM7・C7(♭9)</option><option value="en">Cmaj7・C7(b9)</option></select>
</div>

<h2>コード名を読む</h2>
<div class="row"><input id="cin" value="G7(♭9)/B" size="14"> 調 <input id="ckey" value="C" size="5"></div>
<div class="wrap" id="cout"></div>

<h2>音からコード名を当てる</h2>
<div class="row"><input id="iin" value="E3 G3 C4" size="20"></div>
<div class="wrap" id="iout"></div>

<h2>調</h2>
<div class="row"><input id="kin" value="G" size="6">（例：G・Em・B♭・ト長調）</div>
<div class="wrap" id="kout"></div>

<h2>弦とフレット</h2>
<div class="row"><select id="tun"></select> 弦 <select id="str"></select> フレット <input id="fr" type="number" value="3" min="0" max="24" style="width:5em"></div>
<div id="fout"></div>

<script src="theory.js"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  if(!window.DS||!DS.theory){document.body.insertAdjacentHTML('afterbegin','<p class="err">theory.js を読み込めませんでした。同じフォルダに置いてください。</p>');return;}
  var T=DS.theory;
  function tbl(rows){return '<table>'+rows.map(function(r){return '<tr><th>'+r[0]+'</th><td>'+r[1]+'</td></tr>';}).join('')+'</table>';}
  function chord(){
    var c=T.chord($('cin').value,{key:$('ckey').value||null});
    if(!c){$('cout').innerHTML='<p class="err">読めませんでした</p>';return;}
    if(c.nc){$('cout').innerHTML=tbl([['名前','N.C.（和音なし）']]);return;}
    var r=$('ckey').value?T.roman(c,$('ckey').value):null;
    $('cout').innerHTML=tbl([['名前',c.name],['呼び名',c.ja+(c.feel?'（'+c.feel+'）':'')],['構成音',c.notes.join('・')],['度数',c.labels.join('・')],
      ['低音',c.bass||'—'],['調の中で',r||'—'],['鳴らす音',T.voice(c,{oct:3}).map(function(m){return T.name(m);}).join(' ')]]);
  }
  function ident(){
    var list=$('iin').value.trim().split(/[\s,、]+/).filter(Boolean);
    var bad=list.filter(function(x){return T.midi(x)==null&&T.pc(x)==null;});
    if(bad.length){$('iout').innerHTML='<p class="err">読めない音名：'+bad.join(' ')+'</p>';return;}
    var r=T.identify(list);
    $('iout').innerHTML=r.length?tbl(r.slice(0,5).map(function(c,i){return [i===0?'いちばん近い':'ほかの候補',c.name+(c.omit?'（'+c.omit+'）':'')];})):'<p>当てはまるコードがありません</p>';
  }
  function key(){
    var k=T.key($('kin').value);
    if(!k){$('kout').innerHTML='<p class="err">読めませんでした</p>';return;}
    $('kout').innerHTML=tbl([['調',k.name+'（'+k.ja+'）'],['調号',k.sigText+(k.accidentals.length?'：'+k.accidentals.join(' '):'')],['音階',k.scale.join(' ')],
      ['平行調',k.relative],['3和音',k.chords.map(function(c){return c.name+'<small>（'+c.roman+'）</small>';}).join('　')],
      ['4和音',k.sevenths.map(function(c){return c.name+'<small>（'+c.roman+'）</small>';}).join('　')]]);
  }
  T.TUNINGS.forEach(function(t){$('tun').insertAdjacentHTML('beforeend','<option value="'+t.id+'">'+t.name+'</option>');});
  for(var s=0;s<6;s++) $('str').insertAdjacentHTML('beforeend','<option value="'+s+'">'+T.stringName(s)+'</option>');
  function fret(){
    var m=T.fret(+$('str').value,+$('fr').value,{tuning:$('tun').value});
    $('fout').innerHTML=tbl([['音',T.name(m)+'（'+T.solfa(m)+'）'],['同じ音の場所',T.positions(m,{tuning:$('tun').value}).map(function(p){return T.stringName(p.s)+p.f+'フレット';}).join('・')]]);
  }
  function all(){T.style($('style').value);chord();ident();key();fret();}
  ['cin','ckey','iin','kin','fr'].forEach(function(id){$(id).addEventListener('input',all);});
  ['style','tun','str'].forEach(function(id){$(id).addEventListener('change',all);});
  all();
})();
</script>
</body></html>
