<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>画面の部品 — 見本</title>
<link rel="stylesheet" href="components.css">
<style>
  html,body{margin:0}
  body{background:#d8d2c3;transition:background .4s;font-family:system-ui,sans-serif}
  .bar{position:sticky;top:0;z-index:50;padding:max(8px,env(safe-area-inset-top,0px)) 12px 8px;background:rgba(24,22,20,.9);color:#e9e3d3;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px}
  .bar .g{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  .bar button{font:inherit;font-size:12px;border:1px solid rgba(233,227,211,.35);background:transparent;color:#e9e3d3;border-radius:2px;padding:4px 10px;cursor:pointer}
  .bar button.on{background:#e9e3d3;color:#1a1815;font-weight:700}
  .stage{max-width:430px;margin:0 auto;padding:18px 12px max(40px,env(safe-area-inset-bottom,0px))}
  .err{color:#a03020;padding:20px}
</style></head>
<body>
<div class="bar">
  <div class="g">モチーフ <button class="on" data-m="ds-score">楽譜の紙</button><button data-m="ds-plan">楽器の設計図</button><button data-m="ds-felt">フェルトの手芸</button><button data-m="ds-note">こどもの五線ノート</button></div>
  <div class="g">時間（見本用） <button class="on" data-t="">端末に合わせる</button><button data-t="ds-day">昼</button><button data-t="ds-night">夜</button></div>
  <div class="g"><button class="on" id="snd">効果音あり</button></div>
</div>
<div class="stage">
  <div class="ds-ui ds-score" id="app" data-ds-foot="百合ヶ丘ギター教室" data-ds-title="メトロノーム" data-ds-dwg="MT-01" data-ds-scale="1 : 1">
    <header class="ds-hd"><h1 class="ds-ttl">メトロノーム</h1><p class="ds-sub" id="sub">Metronome — Op. 1</p></header>
    <section class="ds-sec"><h2 class="ds-sh">テンポ</h2><div class="ds-tempo" id="tempo" data-bpm="120" data-beats="4"></div></section>
    <section class="ds-sec"><h2 class="ds-sh">細かさ</h2>
      <div class="ds-choice" id="div" data-ds-value="1"><button value="1">4分</button><button value="2">8分</button><button value="3">3連</button><button value="4">16分</button></div></section>
    <section class="ds-sec"><h2 class="ds-sh">切り替え</h2>
      <label class="ds-toggle"><input type="checkbox" id="acc" checked>1拍目を強く</label><label class="ds-toggle"><input type="checkbox" id="foot">足の図を出す</label></section>
    <section class="ds-sec"><h2 class="ds-sh">操作</h2>
      <button class="ds-btn ds-big" id="start">スタート</button><div style="height:16px"></div>
      <div class="ds-btnbar"><button class="ds-btn" data-ds-open="#set">設定</button><button class="ds-btn" id="save">保存</button><button class="ds-btn ds-danger" id="del" data-ds-hold="長押しで削除します">長押しで削除</button></div></section>
    <section class="ds-sec"><h2 class="ds-sh">記録</h2><div class="ds-list" id="recs"></div></section>
    <div class="ds-sheet" id="set" data-ds-title="設定" data-ds-sub="詳細図 A">
      <section class="ds-sec"><h2 class="ds-sh">拍子</h2>
        <div class="ds-choice" id="ts" data-ds-value="4/4"><button value="4/4">4/4</button><button value="3/4">3/4</button><button value="6/8">6/8</button><button value="7/8">7/8</button></div></section>
      <section class="ds-sec"><h2 class="ds-sh">曲名</h2><label class="ds-field"><span data-alt="Titolo" data-alt-plan="NAME">曲名</span><input id="name" value="いつもの練習曲"></label></section>
      <section class="ds-sec"><h2 class="ds-sh">音量</h2><div class="ds-slider" id="vol" data-value="70" data-ds-dyn aria-label="音量"></div></section>
      <button class="ds-btn ds-big" data-ds-close>閉じる</button>
    </div>
  </div>
</div>
<script>
/* 見本用：モチーフの選び直し（部品を整える前に行う） */
(function(){var h=location.hash.slice(1),m=['ds-plan','ds-felt','ds-note'].indexOf(h)>=0?h:'ds-score',a=document.getElementById('app');a.classList.remove('ds-score','ds-plan','ds-felt','ds-note');a.classList.add(m);
  if(m==='ds-plan')document.getElementById('sub').textContent='METRONOME / MT-01';
  if(m==='ds-felt'||m==='ds-note')document.getElementById('sub').textContent='メトロノームとリズム練習';
  document.querySelectorAll('.bar [data-m]').forEach(function(b){b.classList.toggle('on',b.dataset.m===m);});})();
</script>
<script src="sound.js"></script>
<script src="clock.js"></script>
<script src="components.js"></script>
<script>
(function(){
  if(!window.DS||!DS.ui){document.querySelector('.stage').innerHTML='<p class="err">components.js を読み込めませんでした。同じフォルダに置いてください。</p>';return;}
  var app=document.getElementById('app'),$=function(id){return document.getElementById(id);};
  var t=DS.ui.tempo('#tempo'),clk=null,div=1,beats=4;
  var RECS=[{title:'いつもの練習曲',date:'9月24日',bpm:96},{title:'ブルースの8ビート',date:'9月25日',bpm:120},{title:'3連のシャッフル',date:'9月26日',bpm:88}];
  function drawRecs(){var S=!app.classList.contains('ds-plan');
    DS.ui.list('#recs',RECS.map(function(r){return {title:r.title,sub:r.date,date:S?r.date:r.date.replace('月','/').replace('日',''),value:S?'♩='+r.bpm:r.bpm};}),
      {cols:['NO.','名称 NAME','BPM','DATE'],onPick:function(it,i){t.set(RECS[i].bpm);if(clk)clk.set({bpm:RECS[i].bpm});DS.ui.toast(app,'読み込みました');}});}
  drawRecs();
  // 鳴らす：clock.js の時計に合わせて、テンポの線も動く
  $('start').addEventListener('click',function(){
    if(clk){clk.stop();clk.destroy();clk=null;t.stop();DS.ui.label(this,'スタート',{pressed:false});return;}
    if(!DS.clock){t.start();DS.ui.label(this,'ストップ',{pressed:true});return;}
    clk=DS.clock.create({bpm:t.bpm,meter:[beats,4],div:div,sound:false});
    clk.on('tick',function(tm,p){if(!DS.sound)return;if(p.head)DS.sound.click(p.first&&$('acc').checked,{time:tm,vel:.7});else DS.sound.click(false,{time:tm,vel:.25});});
    clk.start();t.follow(clk);DS.ui.label(this,'ストップ',{pressed:true});});
  t.onChange(function(b){if(clk)clk.set({bpm:b});});
  $('div').addEventListener('change',function(e){div=+e.detail.value;if(clk)clk.set({div:div});});
  $('save').addEventListener('click',function(){DS.sound&&DS.sound.ui('save');DS.ui.toast(app,'保存しました');});
  $('del').addEventListener('ds-hold',function(){DS.ui.toast(app,'削除しました（見本なので消えません）');});
  $('vol').addEventListener('input',function(e){if(DS.sound&&DS.sound.volume)DS.sound.volume(e.detail.value/100);});
  document.addEventListener('pointerdown',function f(){if(DS.sound&&DS.sound.uiPreload)DS.sound.uiPreload();document.removeEventListener('pointerdown',f,true);},true);
  // 見本の切り替え
  var BG={'ds-score':['#d8d2c3','#15110e'],'ds-plan':['#cdd5d8','#0e2a44'],'ds-felt':['#d9cdb8','#1a1512'],'ds-note':['#d8dde0','#10171e']},force='';
  function bg(){var m=['ds-plan','ds-felt','ds-note'].filter(function(k){return app.classList.contains(k);})[0]||'ds-score',dark=force==='ds-night'||(force===''&&matchMedia('(prefers-color-scheme: dark)').matches);document.body.style.background=BG[m][dark?1:0];}
  document.querySelectorAll('.bar [data-m]').forEach(function(b){b.onclick=function(){document.querySelectorAll('.bar [data-m]').forEach(function(x){x.classList.toggle('on',x===b);});
    // モチーフを替えたら、部品を作り直す
    location.hash=b.dataset.m;location.reload();};});
  document.querySelectorAll('.bar [data-t]').forEach(function(b){b.onclick=function(){document.querySelectorAll('.bar [data-t]').forEach(function(x){x.classList.toggle('on',x===b);});
    app.classList.remove('ds-day','ds-night');force=b.dataset.t;if(force)app.classList.add(force);bg();};});
  $('snd').onclick=function(){var on=!DS.ui.sound();DS.ui.sound(on);this.classList.toggle('on',on);this.textContent=on?'効果音あり':'効果音なし';};
  $('snd').classList.toggle('on',DS.ui.sound());$('snd').textContent=DS.ui.sound()?'効果音あり':'効果音なし';
  bg();
})();
</script>
</body></html>
